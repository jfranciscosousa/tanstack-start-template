name: CI

on: [push]

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 15

    services:
      postgres:
        image: postgres:18-alpine
        env:
          POSTGRES_DB: test
          POSTGRES_PASSWORD: postgres
        ports:
          - 5432:5432
        options: --health-cmd pg_isready --health-interval 10s --health-timeout 5s --health-retries 5

    # Canonical test env for every step (step-level `env` still wins where set).
    # APP_ENV=test makes Varlock validate the env the tests actually run in.
    env:
      APP_ENV: test
      DATABASE_URL: postgres://postgres:postgres@localhost:5432/test
      BETTER_AUTH_SECRET: ChangeThisBeforeShippingToProdOrYouWillBeFired
      BETTER_AUTH_URL: http://localhost:3001

    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7

      - uses: marocchino/tool-versions-action@4219f2e6bfdb4cce482b78f71ad9663e64f4d247 # v2
        id: versions

      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7
        with:
          node-version: ${{ steps.versions.outputs.nodejs }}

      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2
        with:
          bun-version: ${{ steps.versions.outputs.bun }}

      - name: Cache playwright deps
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6
        with:
          path: ~/.cache/ms-playwright
          key: ${{ runner.os }}-build-playwright-10052025
          restore-keys: |
            ${{ runner.os }}-build-playwright-10052025

      - name: Install dependencies
        run: |
          bun install --frozen-lockfile
          bun run playwright install chromium

      - name: Lint
        run: |
          bun run lint
          bun run ts-check
          bun run format --check

      - name: Build
        run: |
          bun run build

      - name: Vitest
        run: |
          bun run test:vitest
        env:
          BETTER_AUTH_SECRET: ChangeThisBeforeShippingToProdOrYouWillBeFired
          DATABASE_URL: postgres://postgres:postgres@localhost:5432/test

      - name: E2E
        run: |
          bun run test:e2e
        env:
          BETTER_AUTH_SECRET: ChangeThisBeforeShippingToProdOrYouWillBeFired
          DATABASE_URL: postgres://postgres:postgres@localhost:5432/test
          BETTER_AUTH_URL: http://localhost:3001

      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        if: ${{ !cancelled() }}
        with:
          name: playwright-report
          path: test-results/
          retention-days: 30
