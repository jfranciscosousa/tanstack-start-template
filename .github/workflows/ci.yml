name: CI

on: [push]

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 15

    services:
      postgres:
        image: postgres:18-alpine
        env:
          POSTGRES_DB: test
          POSTGRES_PASSWORD: postgres
        ports:
          - 5432:5432
        options: --health-cmd pg_isready --health-interval 10s --health-timeout 5s --health-retries 5

    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6

      - uses: marocchino/tool-versions-action@4219f2e6bfdb4cce482b78f71ad9663e64f4d247 # v2
        id: versions

      - uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6
        with:
          node-version: ${{ steps.versions.outputs.nodejs }}

      - uses: pnpm/action-setup@0977fd99725f1db4007ccb2928dbb4e90d06cc86 # v6
        name: Install pnpm
        id: pnpm-install
        with:
          version: ${{ steps.versions.outputs.pnpm }}
          run_install: false

      - name: Get pnpm store directory
        id: pnpm-cache
        shell: bash
        run: |
          echo "STORE_PATH=$(pnpm store path)" >> $GITHUB_OUTPUT

      - uses: actions/cache@caa296126883cff596d87d8935842f9db880ef25 # v5
        name: Setup pnpm cache
        with:
          path: ${{ steps.pnpm-cache.outputs.STORE_PATH }}
          key: ${{ runner.os }}-pnpm-store-10052025
          restore-keys: |
            ${{ runner.os }}-pnpm-store-10052025

      - name: Cache playwright deps
        uses: actions/cache@caa296126883cff596d87d8935842f9db880ef25 # v5
        with:
          path: ~/.cache/ms-playwright
          key: ${{ runner.os }}-build-playwright-10052025
          restore-keys: |
            ${{ runner.os }}-build-playwright-10052025

      - name: Install dependencies
        run: |
          pnpm i
          npx playwright install chromium

      - name: Lint
        run: |
          pnpm lint
          pnpm ts-check

      - name: Vitest
        run: |
          pnpm test:vitest
        env:
          BETTER_AUTH_SECRET: ChangeThisBeforeShippingToProdOrYouWillBeFired
          DATABASE_URL: postgres://postgres:postgres@localhost:5432/test

      - name: E2E
        run: |
          pnpm test:e2e
        env:
          BETTER_AUTH_SECRET: ChangeThisBeforeShippingToProdOrYouWillBeFired
          DATABASE_URL: postgres://postgres:postgres@localhost:5432/test
          BETTER_AUTH_URL: http://localhost:3001

      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        if: ${{ !cancelled() }}
        with:
          name: playwright-report
          path: test-results/
          retention-days: 30
